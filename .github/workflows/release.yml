name: release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build Windows binary
        run: go build -trimpath -ldflags="-s -w" -o naivereal-tui.exe .
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $release = "${{ github.ref_name }}"
          if (gh release view $release --repo "${{ github.repository }}" 2>$null) {
            Write-Host "release $release already exists"
          } else {
            gh release create $release --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "naivereal-tui $release" --notes "Windows TUI for naivereal"
          }
          gh release upload $release --repo "${{ github.repository }}" naivereal-tui.exe --clobber
